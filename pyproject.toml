[project]
name = "cmdb"
version = "2.0.0"
description = "CMDB v2 — 采集推送、字段级 diff 冲突裁决、存储与展示"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
